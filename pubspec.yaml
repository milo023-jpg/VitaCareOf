name: vitacareof

description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  go_router: ^16.2.4
  cupertino_icons: ^1.0.8

  flutter_markdown: ^0.7.3

  # Animated FloatingActionButton 
  flutter_speed_dial: ^7.0.0
  # FIREBASE
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  firebase_ui_auth: ^3.0.0
  cloud_firestore: ^6.0.2

  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
    

  
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/vitacarelogo.png
    - assets/data/health_articles.json
    - assets/images/tips/
